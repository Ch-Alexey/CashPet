# Автоодобрение PR в своей зоне (docs/команда). Своё одобрение GitHub не засчитывает,
# поэтому одобряет бот github-actions — если автор из списка и все файлы в его зоне.
# PR Ярика и PR, задевающие чужую зону, ждут живого ревьюера. CI build обязателен всегда.
name: Автоодобрение своей зоны

# pull_request_target: workflow всегда берётся из main, а не из PR — иначе автор мог бы
# поправить этот файл в своём PR и одобрить сам себя. Код из PR здесь не выполняется:
# скрипт только читает через API список изменённых файлов, поэтому права на запись безопасны.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    # Только ветки этого репозитория, не форки
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Зоны — префиксы путей. Пустая строка — весь репозиторий.
            // Леха и Виталик — общая зона на весь репозиторий, кроме правил одобрения:
            // бот и CODEOWNERS меняет только Леха, иначе правила ревью меняли бы сами себя
            const approvalRules = ['.github/workflows/auto-approve.yml', '.github/CODEOWNERS'];
            const zones = {
              'Ch-Alexey':   { allow: [''], deny: [] },
              '1Oblivious1': { allow: [''], deny: approvalRules },
              'Alexwww228':  { allow: ['app/', 'design/', 'docs/'], deny: [] },
            };
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const allowed = zones[author];
            if (!allowed) {
              core.info(`${author}: автоодобрения нет, нужен ревьюер`);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
            });
            // При переименовании проверяем и старый путь
            const paths = files.flatMap(f => f.previous_filename ? [f.filename, f.previous_filename] : [f.filename]);
            const inZone = p => allowed.allow.some(prefix => p.startsWith(prefix))
                             && !allowed.deny.some(prefix => p.startsWith(prefix));
            const outside = paths.filter(p => !inZone(p));
            if (outside.length > 0) {
              core.info(`Файлы вне зоны ${author}, нужен ревьюер:\n${outside.join('\n')}`);
              return;
            }
            await github.rest.pulls.createReview({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
              event: 'APPROVE',
              body: `Автоодобрение: все ${paths.length} файлов — в зоне ${author}.`,
            });
